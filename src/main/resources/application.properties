spring.application.name=CATOOLS

# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/catools
spring.datasource.username=postgres
spring.datasource.password=testpassword123
#spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA settings
# 'update' automatically alters your DB schema to match your Java models on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Shows the SQL statements generated by Hibernate in your console log (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
